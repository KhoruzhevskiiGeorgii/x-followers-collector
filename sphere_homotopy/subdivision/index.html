<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Subdivision curve visualizer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel2: #1e222b;
      --text: #edf1f7;
      --muted: #9aa5b4;
      --line: #303745;
      --accent: #7ab7ff;
      --accent2: #ffbf69;
      --danger: #ff7b7b;
      --ok: #9ce6b2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: 100vh;
    }
    .panel {
      padding: 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    .sub { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 18px; }
    .group { margin: 14px 0; }
    label { display:block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    input[type="text"], input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 9px;
      padding: 9px 10px;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .range-line { display:grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    input[type="range"] { width: 100%; }
    .step-badge {
      min-width: 36px;
      text-align:center;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-variant-numeric: tabular-nums;
    }
    .checks { display:grid; gap: 7px; margin-top: 8px; }
    .checks label { display:flex; align-items:center; gap:8px; margin:0; color:var(--text); }
    .formula {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 10px;
      border-radius: 9px;
      background: var(--panel2);
      border: 1px solid var(--line);
      overflow-x: auto;
    }
    .status { min-height: 20px; margin-top: 10px; color: var(--ok); font-size: 12px; line-height: 1.4; }
    .status.error { color: var(--danger); }
    .presets { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
    button {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 9px;
      cursor:pointer;
    }
    button:hover { border-color:var(--accent); }
    .stage { min-width:0; display:grid; grid-template-rows: 1fr auto; }
    .canvas-wrap { position:relative; min-height: 560px; }
    canvas { width:100%; height:100%; display:block; }
    .legend {
      position:absolute;
      top:14px;
      right:14px;
      padding:8px 10px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      border-radius:9px;
      font-size:12px;
      line-height:1.55;
      backdrop-filter: blur(8px);
    }
    .swatch { display:inline-block; width:18px; height:2px; vertical-align:middle; margin-right:7px; }
    .swatch.ref { background: var(--muted); }
    .swatch.cur { background: var(--accent); }
    .swatch.limit { background: var(--accent2); }
    .footer {
      border-top:1px solid var(--line);
      background:var(--panel);
      padding:9px 14px;
      color:var(--muted);
      font-size:12px;
      display:flex;
      gap:16px;
      flex-wrap:wrap;
    }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; grid-template-rows:auto 68vh; }
      .panel { border-right:0; border-bottom:1px solid var(--line); }
      .canvas-wrap { min-height: 460px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Subdivision curve visualizer</h1>
    <div class="sub">Бинарная симметричная corner-cutting схема. <code>n</code> в <code>c(n)</code> — номер refinement-шага, начиная с 0.</div>

    <div class="group">
      <label for="fexpr">f(x)</label>
      <input id="fexpr" type="text" value="x^3" spellcheck="false" />
      <div class="presets">
        <button data-f="x^2">x²</button>
        <button data-f="x^3">x³</button>
        <button data-f="sin(x)">sin x</button>
        <button data-f="exp(-x^2)">Gaussian</button>
      </div>
    </div>

    <div class="row group">
      <div>
        <label for="h">шаг h</label>
        <input id="h" type="number" step="any" value="1" />
      </div>
      <div>
        <label for="tau">смещение τ</label>
        <input id="tau" type="number" step="any" value="0" />
      </div>
    </div>

    <div class="group">
      <label for="cexpr">c(n)</label>
      <input id="cexpr" type="text" value="1/4" spellcheck="false" />
      <div class="presets">
        <button data-c="1/4">Chaikin 1/4</button>
        <button data-c="1/5">1/5</button>
        <button data-c="1/3">1/3</button>
        <button data-c="1/(4*cos(pi/(3*2^(n+1)))^2)">circle c(n)</button>
      </div>
    </div>

    <div class="row group">
      <div>
        <label for="xmin">x min</label>
        <input id="xmin" type="number" step="any" value="-4" />
      </div>
      <div>
        <label for="xmax">x max</label>
        <input id="xmax" type="number" step="any" value="4" />
      </div>
    </div>

    <div class="group">
      <label>номер шага</label>
      <div class="range-line">
        <input id="iter" type="range" min="0" max="10" step="1" value="0" />
        <span id="iterValue" class="step-badge">0</span>
      </div>
    </div>

    <div class="checks">
      <label><input id="showRef" type="checkbox" checked /> исходная функция</label>
      <label><input id="showPts" type="checkbox" checked /> вершины ломаной</label>
      <label><input id="showLimit" type="checkbox" /> шаг 10 как визуальный proxy предела</label>
      <label><input id="autoY" type="checkbox" checked /> auto-scale по y</label>
    </div>

    <div class="group formula">
      q[2i]   = (1-cₙ)p[i] + cₙp[i+1]<br />
      q[2i+1] = cₙp[i] + (1-cₙ)p[i+1]<br /><br />
      xᵢ = h(i+τ), &nbsp; pᵢ=(xᵢ,f(xᵢ))
    </div>
    <div id="status" class="status"></div>
  </aside>

  <main class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="plot"></canvas>
      <div class="legend">
        <div><span class="swatch ref"></span>f(x)</div>
        <div><span class="swatch cur"></span>Hₙ</div>
        <div><span class="swatch limit"></span>H₁₀</div>
      </div>
    </div>
    <div class="footer">
      <span id="pointCount">точек: —</span>
      <span id="cNow">c(n): —</span>
      <span>мышь/тач: пока без pan/zoom; диапазон задаётся слева</span>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const els = {
    fexpr: $('fexpr'), h: $('h'), tau: $('tau'), cexpr: $('cexpr'),
    xmin: $('xmin'), xmax: $('xmax'), iter: $('iter'), iterValue: $('iterValue'),
    showRef: $('showRef'), showPts: $('showPts'), showLimit: $('showLimit'), autoY: $('autoY'),
    status: $('status'), plot: $('plot'), canvasWrap: $('canvasWrap'),
    pointCount: $('pointCount'), cNow: $('cNow')
  };

  const aliases = {
    sin: 'Math.sin', cos: 'Math.cos', tan: 'Math.tan', asin: 'Math.asin', acos: 'Math.acos', atan: 'Math.atan',
    sinh: 'Math.sinh', cosh: 'Math.cosh', tanh: 'Math.tanh', exp: 'Math.exp', log: 'Math.log', ln: 'Math.log',
    sqrt: 'Math.sqrt', abs: 'Math.abs', floor: 'Math.floor', ceil: 'Math.ceil', round: 'Math.round',
    min: 'Math.min', max: 'Math.max', pow: 'Math.pow', pi: 'Math.PI', e: 'Math.E'
  };

  function compileExpression(src, variables) {
    let s = String(src).trim();
    if (!s) throw new Error('Пустое выражение');
    if (/[^0-9A-Za-z_+\-*/^().,\s]/.test(s)) throw new Error('В выражении есть неподдерживаемый символ');
    s = s.replace(/\^/g, '**');
    for (const [name, replacement] of Object.entries(aliases)) {
      s = s.replace(new RegExp(`\\b${name}\\b`, 'gi'), replacement);
    }
    const reserved = new Set([...variables, 'Math']);
    const tokens = s.match(/[A-Za-z_]\w*/g) || [];
    for (const token of tokens) {
      if (reserved.has(token)) continue;
      if (Object.prototype.hasOwnProperty.call(Math, token)) continue;
      const idx = s.indexOf(token);
      if (idx >= 5 && s.slice(idx - 5, idx) === 'Math.') continue;
      throw new Error(`Неизвестное имя: ${token}`);
    }
    const fn = new Function(...variables, `"use strict"; return (${s});`);
    return (...args) => {
      const v = fn(...args);
      if (!Number.isFinite(v)) throw new Error(`Выражение дало нечисловое значение: ${v}`);
      return v;
    };
  }

  function refine(points, c) {
    if (!(c > 0 && c < 0.5)) throw new Error(`Нужно 0 < c(n) < 1/2, сейчас ${c}`);
    const out = [];
    for (let i = 0; i + 1 < points.length; i++) {
      const a = points[i], b = points[i + 1];
      out.push({ x: (1-c)*a.x + c*b.x, y: (1-c)*a.y + c*b.y });
      out.push({ x: c*a.x + (1-c)*b.x, y: c*a.y + (1-c)*b.y });
    }
    return out;
  }

  function iterate(points, steps, cFn) {
    let cur = points;
    for (let n = 0; n < steps; n++) cur = refine(cur, cFn(n));
    return cur;
  }

  function initialPoints(f, h, tau, xmin, xmax, padSteps) {
    if (!(h > 0)) throw new Error('h должен быть > 0');
    if (!(xmin < xmax)) throw new Error('Нужно x min < x max');
    const pad = Math.max(3, padSteps + 2);
    const i0 = Math.floor(xmin / h - tau) - pad;
    const i1 = Math.ceil(xmax / h - tau) + pad;
    const pts = [];
    for (let i = i0; i <= i1; i++) {
      const x = h * (i + tau);
      pts.push({x, y: f(x)});
    }
    if (pts.length < 2) throw new Error('Слишком мало начальных точек');
    return pts;
  }

  function getCss(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function draw() {
    const canvas = els.plot;
    const wrap = els.canvasWrap;
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(320, wrap.clientWidth);
    const hpx = Math.max(320, wrap.clientHeight);
    canvas.width = Math.round(w*dpr);
    canvas.height = Math.round(hpx*dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,hpx);

    try {
      const f = compileExpression(els.fexpr.value, ['x']);
      const cFn = compileExpression(els.cexpr.value, ['n']);
      const hh = Number(els.h.value), tau = Number(els.tau.value);
      const xmin = Number(els.xmin.value), xmax = Number(els.xmax.value);
      const steps = Number(els.iter.value);
      const maxStep = Number(els.iter.max);
      const base = initialPoints(f, hh, tau, xmin, xmax, maxStep);
      const cur = iterate(base, steps, cFn);
      const lim = els.showLimit.checked ? iterate(base, maxStep, cFn) : null;

      for (let n=0; n<Math.max(steps, els.showLimit.checked ? maxStep : 0); n++) {
        const cv = cFn(n);
        if (!(cv > 0 && cv < .5)) throw new Error(`c(${n})=${cv}; требуется 0<c(n)<1/2`);
      }

      const visibleCur = cur.filter(p => p.x >= xmin && p.x <= xmax);
      const visibleLim = lim ? lim.filter(p => p.x >= xmin && p.x <= xmax) : [];

      let ymin = Infinity, ymax = -Infinity;
      const collect = p => { if (Number.isFinite(p.y)) { ymin=Math.min(ymin,p.y); ymax=Math.max(ymax,p.y); } };
      visibleCur.forEach(collect);
      visibleLim.forEach(collect);
      if (els.showRef.checked) {
        for (let k=0;k<=400;k++) {
          const x = xmin + (xmax-xmin)*k/400;
          collect({y:f(x)});
        }
      }
      if (!Number.isFinite(ymin) || !Number.isFinite(ymax)) throw new Error('Не удалось определить диапазон y');
      if (!els.autoY.checked) {
        const m = Math.max(Math.abs(ymin), Math.abs(ymax), 1);
        ymin = -m; ymax = m;
      }
      if (Math.abs(ymax-ymin) < 1e-12) { ymin -= 1; ymax += 1; }
      const ypad = 0.08*(ymax-ymin);
      ymin -= ypad; ymax += ypad;

      const left=58, right=20, top=20, bottom=42;
      const pw = w-left-right, ph = hpx-top-bottom;
      const X = x => left + (x-xmin)/(xmax-xmin)*pw;
      const Y = y => top + (ymax-y)/(ymax-ymin)*ph;

      ctx.lineWidth = 1;
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillStyle = getCss('--muted');
      ctx.strokeStyle = getCss('--line');
      const gx = 8, gy = 8;
      for (let i=0;i<=gx;i++) {
        const x=xmin+(xmax-xmin)*i/gx, px=X(x);
        ctx.beginPath(); ctx.moveTo(px,top); ctx.lineTo(px,top+ph); ctx.stroke();
        ctx.fillText(formatNum(x), px-12, top+ph+19);
      }
      for (let j=0;j<=gy;j++) {
        const y=ymin+(ymax-ymin)*j/gy, py=Y(y);
        ctx.beginPath(); ctx.moveTo(left,py); ctx.lineTo(left+pw,py); ctx.stroke();
        ctx.fillText(formatNum(y), 5, py+4);
      }
      if (xmin <= 0 && xmax >= 0) {
        ctx.strokeStyle = '#657083'; ctx.lineWidth=1.25;
        const px=X(0); ctx.beginPath(); ctx.moveTo(px,top); ctx.lineTo(px,top+ph); ctx.stroke();
      }
      if (ymin <= 0 && ymax >= 0) {
        ctx.strokeStyle = '#657083'; ctx.lineWidth=1.25;
        const py=Y(0); ctx.beginPath(); ctx.moveTo(left,py); ctx.lineTo(left+pw,py); ctx.stroke();
      }

      if (els.showRef.checked) {
        ctx.setLineDash([6,5]);
        ctx.strokeStyle = getCss('--muted');
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        let pen=false;
        for (let k=0;k<=900;k++) {
          const x=xmin+(xmax-xmin)*k/900;
          let y;
          try { y=f(x); } catch { pen=false; continue; }
          if (!Number.isFinite(y) || y<ymin-10*(ymax-ymin) || y>ymax+10*(ymax-ymin)) { pen=false; continue; }
          if (!pen) { ctx.moveTo(X(x),Y(y)); pen=true; } else ctx.lineTo(X(x),Y(y));
        }
        ctx.stroke(); ctx.setLineDash([]);
      }

      if (lim) drawPolyline(ctx, visibleLim, X, Y, getCss('--accent2'), 1.4, false);
      drawPolyline(ctx, visibleCur, X, Y, getCss('--accent'), 2.2, els.showPts.checked && visibleCur.length <= 2500);

      els.status.textContent = 'OK';
      els.status.className = 'status';
      els.iterValue.textContent = String(steps);
      els.pointCount.textContent = `точек Hₙ: ${cur.length.toLocaleString('ru-RU')} (видимо ${visibleCur.length.toLocaleString('ru-RU')})`;
      els.cNow.textContent = steps < maxStep ? `следующий c(${steps}) = ${formatNum(cFn(steps),6)}` : `c(${steps-1}) = ${formatNum(cFn(Math.max(0,steps-1)),6)}`;
    } catch (err) {
      els.status.textContent = err?.message || String(err);
      els.status.className = 'status error';
      els.pointCount.textContent = 'точек: —';
      els.cNow.textContent = 'c(n): —';
    }
  }

  function drawPolyline(ctx, pts, X, Y, stroke, width, points) {
    if (!pts.length) return;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = width;
    ctx.beginPath();
    pts.forEach((p,i) => i ? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y)));
    ctx.stroke();
    if (points) {
      ctx.fillStyle = stroke;
      const r = pts.length > 700 ? 1.4 : 2.6;
      for (const p of pts) {
        ctx.beginPath(); ctx.arc(X(p.x),Y(p.y),r,0,Math.PI*2); ctx.fill();
      }
    }
  }

  function formatNum(v, digits=4) {
    if (!Number.isFinite(v)) return String(v);
    const a=Math.abs(v);
    if ((a!==0 && a<1e-3) || a>=1e4) return v.toExponential(2);
    return Number(v.toFixed(digits)).toString();
  }

  document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { els.fexpr.value=b.dataset.f; draw(); }));
  document.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { els.cexpr.value=b.dataset.c; draw(); }));
  Object.values(els).forEach(el => {
    if (el instanceof HTMLInputElement) {
      el.addEventListener('input', draw);
      el.addEventListener('change', draw);
    }
  });
  window.addEventListener('resize', draw);
  draw();
})();
</script>
</body>
</html>
